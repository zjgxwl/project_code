device: auto
seed: 42
fast_dev_run: true
max_train_batches: 2
max_val_batches: 2
num_workers: 0
use_fake_data: false

dataset:
  name: tiny_imagenet
  data_dir: data
  archive_path: null
  url: http://cs231n.stanford.edu/tiny-imagenet-200.zip
  use_fake_data: false
  download: false
  train_subset_size: 128
  val_subset_size: 64
  num_classes: 200
  image_size: 64
  batch_size: 8
  num_workers: 0

model:
  name: resnet18
  num_classes: 200

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

pruning:
  scorer: snip
  sparsity: 0.9
  score_batches: 1

method:
  name: tspr
  lambda0: 0.0001
  eps: 0.00000001
  delta: 0.000000000001

tcsm:
  alpha: 0.5
  beta: 0.5
  eta: 0.05
  delta: 0.000000000001
  calibration_batches: 1
  sign_batches: 1

egro:
  lambda0: 0.0001
  flops_reduction: 0.5
  min_keep_ratio: 0.2
  safety_beta: 0.0
  eta_g: 0.05
  delta: 0.000000000001
  input_shape: [1, 3, 64, 64]

training:
  epochs: 1
