chapter: chapter4

capabilities:
  models:
    resnet18: supported
    vgg11_bn: supported
    vgg16_bn: supported
    resnet34: supported
    mobilenetv2: supported
  methods:
    tcsm_tspr: supported
    base_only: supported
    random_subset: supported
    full_data: supported

profiles:
  quick:
    device: auto
    seeds: [42]
    models: [resnet18]
    scorers: [magnitude]
    methods: [tcsm_tspr]
    sparsities: [0.9]
    flops_reductions: [null]
    dataset:
      name: cifar10
      data_dir: outputs/thesis_real_data
      download: false
      num_classes: 10
      image_size: 32
      batch_size: 8
      num_workers: 0
      train_subset_size: 32
      val_subset_size: 16
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0005
    scheduler:
      name: cosine
    tcsm:
      calibration_mode: tcsm
      alpha: 0.5
      beta: 0.5
      eta: 0.05
      delta: 0.000000000001
      calibration_batches: 1
      sign_batches: 1
      stability_repeats: 1
    training:
      epochs: 1
      max_train_batches: 2
      max_val_batches: 2
      eval_interval: 1
      checkpoint_interval: 0

  mini-real:
    device: auto
    seeds: [42]
    models: [resnet18]
    scorers: [magnitude]
    methods: [tcsm_tspr]
    sparsities: [0.9]
    flops_reductions: [null]
    dataset:
      name: cifar10
      data_dir: outputs/thesis_real_data
      download: false
      num_classes: 10
      image_size: 32
      batch_size: 16
      num_workers: 0
      train_subset_size: 64
      val_subset_size: 32
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0005
    scheduler:
      name: cosine
    tcsm:
      calibration_mode: tcsm
      alpha: 0.5
      beta: 0.5
      eta: 0.05
      delta: 0.000000000001
      calibration_batches: 1
      sign_batches: 1
      stability_repeats: 1
    training:
      epochs: 2
      max_train_batches: 2
      max_val_batches: 2
      eval_interval: 1
      checkpoint_interval: 1

  full:
    device: auto
    seeds: [1, 2, 3, 4, 5]
    models: [resnet18, vgg16_bn]
    scorers: [snip, grasp, synflow, ep]
    methods: [base_only, random_subset, tcsm_tspr, full_data]
    sparsities: [0.9, 0.95, 0.98]
    flops_reductions: [null]
    datasets:
      - {name: cifar10, data_dir: data, num_classes: 10, image_size: 32, batch_size: 128, num_workers: 4}
      - {name: cifar100, data_dir: data, num_classes: 100, image_size: 32, batch_size: 128, num_workers: 4}
      - {name: tiny_imagenet, data_dir: data, num_classes: 200, image_size: 64, batch_size: 128, num_workers: 4}
    optimizer:
      name: sgd
      lr: 0.1
      momentum: 0.9
      weight_decay: 0.0005
    scheduler:
      name: cosine
    tcsm:
      calibration_mode: tcsm
      alpha: 0.5
      beta: 0.5
      eta: 0.05
      delta: 0.000000000001
      calibration_batches: 1
      sign_batches: 1
      stability_repeats: 3
    training:
      epochs: 200
      eval_interval: 1
      checkpoint_interval: 50
