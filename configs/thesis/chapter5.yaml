chapter: chapter5

capabilities:
  models:
    vgg11_bn: supported
    vgg16_bn: supported
    resnet18: future
    resnet34: future
    mobilenetv2: future
  methods:
    egro: supported
    l1_norm: external_only
    fpgm: external_only
    hrank: external_only
    depgraph: external_only

profiles:
  quick:
    device: auto
    seeds: [42]
    models: [vgg11_bn]
    scorers: [magnitude]
    methods: [egro]
    sparsities: [0.9]
    flops_reductions: [0.5]
    dataset:
      name: cifar10
      data_dir: outputs/thesis_real_data
      download: false
      num_classes: 10
      image_size: 32
      batch_size: 8
      num_workers: 0
      train_subset_size: 32
      val_subset_size: 16
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0005
    scheduler:
      name: cosine
    tcsm:
      calibration_mode: tcsm
      alpha: 0.5
      beta: 0.5
      eta: 0.05
      delta: 0.000000000001
      calibration_batches: 1
      sign_batches: 1
      stability_repeats: 1
    egro:
      lambda0: 0.0001
      flops_reduction: 0.5
      min_keep_ratio: 0.2
      safety_beta: 0.0
      eta_g: 0.05
      delta: 0.000000000001
      input_shape: [1, 3, 32, 32]
    training:
      epochs: 1
      max_train_batches: 2
      max_val_batches: 2
      eval_interval: 1
      checkpoint_interval: 0

  mini-real:
    device: auto
    seeds: [42]
    models: [vgg11_bn]
    scorers: [magnitude]
    methods: [egro]
    sparsities: [0.9]
    flops_reductions: [0.5]
    dataset:
      name: cifar10
      data_dir: outputs/thesis_real_data
      download: false
      num_classes: 10
      image_size: 32
      batch_size: 16
      num_workers: 0
      train_subset_size: 64
      val_subset_size: 32
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0005
    scheduler:
      name: cosine
    tcsm:
      calibration_mode: tcsm
      alpha: 0.5
      beta: 0.5
      eta: 0.05
      delta: 0.000000000001
      calibration_batches: 1
      sign_batches: 1
      stability_repeats: 1
    egro:
      lambda0: 0.0001
      flops_reduction: 0.5
      min_keep_ratio: 0.2
      safety_beta: 0.0
      eta_g: 0.05
      delta: 0.000000000001
      input_shape: [1, 3, 32, 32]
    training:
      epochs: 2
      max_train_batches: 2
      max_val_batches: 2
      eval_interval: 1
      checkpoint_interval: 1

  full:
    device: auto
    seeds: [1, 2, 3, 4, 5]
    models: [resnet18, vgg16_bn, resnet34, mobilenetv2]
    scorers: [snip, grasp, synflow, ep]
    methods: [l1_norm, fpgm, hrank, depgraph, egro]
    sparsities: [0.9]
    flops_reductions: [0.3, 0.5, 0.7]
    datasets:
      - {name: cifar10, data_dir: data, num_classes: 10, image_size: 32, batch_size: 128, num_workers: 4}
      - {name: cifar100, data_dir: data, num_classes: 100, image_size: 32, batch_size: 128, num_workers: 4}
      - {name: tiny_imagenet, data_dir: data, num_classes: 200, image_size: 64, batch_size: 128, num_workers: 4}
    optimizer:
      name: sgd
      lr: 0.1
      momentum: 0.9
      weight_decay: 0.0005
    scheduler:
      name: cosine
    tcsm:
      calibration_mode: tcsm
      alpha: 0.5
      beta: 0.5
      eta: 0.05
      delta: 0.000000000001
      calibration_batches: 1
      sign_batches: 1
      stability_repeats: 3
    egro:
      lambda0: 0.0001
      min_keep_ratio: 0.2
      safety_beta: 0.0
      eta_g: 0.05
      delta: 0.000000000001
    training:
      epochs: 200
      eval_interval: 1
      checkpoint_interval: 50
